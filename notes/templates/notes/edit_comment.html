{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h2>Редактировать комментарий</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #667eea; color: white; padding: 10px; border: none; border-radius: 5px;">
            Сохранить
        </button>
        <a href="{% url 'notes:detail' comment.note.id %}" style="margin-left: 10px;">Отмена</a>
    </form>
</div>
{% endblock %}
