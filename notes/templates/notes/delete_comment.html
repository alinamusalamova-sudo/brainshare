{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; text-align: center;">
    <h2>Удалить комментарий?</h2>
    <p>Вы уверены, что хотите удалить этот комментарий?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background: #d1005a; color: white; padding: 10px 20px; border: none; border-radius: 5px;">
            Да, удалить
        </button>
        <a href="{% url 'notes:detail' comment.note.id %}" style="margin-left: 10px;">Отмена</a>
    </form>
</div>
{% endblock %}
