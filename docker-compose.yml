version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: brainshare_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: bash -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 brainshare.asgi:application"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: brainshare_db
      DB_USER: admin
      DB_PASSWORD: adminpassword
      REDIS_HOST: redis

volumes:
  postgres_data: